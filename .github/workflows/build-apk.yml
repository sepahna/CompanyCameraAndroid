name: Build Company Camera APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app version
        id: version
        run: |
          CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Detected versionCode=$CODE versionName=$NAME"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "company-camera-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-camera-debug-apk
          path: company-camera-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: Company Camera ${{ steps.version.outputs.name }}
          body: |
            versionCode=${{ steps.version.outputs.code }}
            versionName=${{ steps.version.outputs.name }}

            تغییرات این نسخه:
            - منوی پایین (داشبورد / دوربین / تاریخچه / تنظیمات)
            - روشن شدن دوربین فقط با کلیک کاربر
            - بررسی و نصب به‌روزرسانی از داخل برنامه
          files: company-camera-${{ steps.version.outputs.name }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
